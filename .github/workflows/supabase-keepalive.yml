# Mantém o projeto do Supabase ativo.
# No plano gratuito, o Supabase pausa projetos após ~7 dias sem atividade.
# Consultas SQL diretas ao banco não bastaram (o projeto pausou mesmo com elas),
# então a tarefa também acessa a API REST do Supabase, todos os dias.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   DATABASE_URL              connection string do backend/.env (postgresql://postgres.<projeto>:...)
#   SUPABASE_PUBLISHABLE_KEY  chave pública do projeto (sb_publishable_...)
# Se algum passo falhar, o GitHub envia um e-mail avisando.

name: Supabase keepalive

on:
  schedule:
    - cron: "0 12 * * *"  # todo dia, 12:00 UTC (09:00 em Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Conferir secrets
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Secret DATABASE_URL não configurado."; exit 1; }
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || { echo "::error::Secret SUPABASE_PUBLISHABLE_KEY não configurado."; exit 1; }

      - name: Acesso pela API REST do Supabase
        run: |
          # O identificador do projeto vem do usuário da connection string: postgres.<projeto>
          PROJETO=$(echo "$DATABASE_URL" | sed -E 's#^[a-z+]+://postgres\.([a-z0-9]+):.*#\1#')
          curl --fail-with-body -sS "https://$PROJETO.supabase.co/rest/v1/vagas?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
          echo
          echo "API REST respondeu."

      - name: Consulta no banco
        run: |
          # Remove o "+psycopg" caso a URL tenha sido copiada nesse formato.
          URL="${DATABASE_URL/postgresql+psycopg:/postgresql:}"
          psql "$URL" -v ON_ERROR_STOP=1 -c "SELECT now() AS ping, (SELECT count(*) FROM vagas) AS vagas;"
