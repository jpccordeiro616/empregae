<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empregae - Conectando Jovens e Empresas</title>
    <meta name="description" content="Plataforma que conecta jovens aprendizes a empresas que precisam cumprir a cota da Lei da Aprendizagem.">
    <script>
        // Aplica o tema antes de desenhar a página: escolha salva ou preferência do sistema.
        (function () {
            var tema = null;
            try { tema = localStorage.getItem('empregae_tema'); } catch (e) {}
            if (!tema) tema = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = tema;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>O Empregae precisa de JavaScript ativado para funcionar.</noscript>
    <!-- Ordem importa: utilidades e API primeiro, telas no meio, app.js (inicialização) por último. -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/publico.js"></script>
    <script src="js/jovem.js"></script>
    <script src="js/empresa.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
